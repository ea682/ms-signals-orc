groups:
  - name: signals-hot-handoff
    rules:
      - alert: SignalsHotInboxStaleProcessing
        expr: signals_hyperliquid_direct_ingest_processing_stale > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Signals has expired durable USER_FILL claims"

      - alert: SignalsHotOutboxOldestPending
        expr: signals_metric_outbox_oldest_pending_age_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Signals economic outbox is not draining"

      - alert: SignalsHotOutboxPublishFailures
        expr: increase(signals_metric_outbox_publish_total{result="failure"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Signals cannot publish durable outbox rows to Kafka"

      - alert: SignalsHotIdempotencyConflict
        expr: increase(signals_hyperliquid_direct_ingest_distributed_dedupe_total{result=~"payload_conflict|replica_payload_divergence"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Signals rejected contradictory economics for one source identity"

      - alert: SignalsHotDuplicateIngest
        expr: increase(duplicate_noop_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Signals received duplicate Hyperliquid transport deliveries"

      - alert: SignalsHotIngressWithoutDurableHandoff
        expr: increase(signals_hyperliquid_user_fill_ingress_total{deliveryMode="LIVE_USER_FILL"}[5m]) > 0 and increase(signals_hyperliquid_user_fill_durable_total{deliveryMode="LIVE_USER_FILL"}[5m]) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Signals accepts HOT ingress without durable USER_FILL progress"

      - alert: SignalsUpButEconomicHandoffStalled
        expr: up{job=~".*signals.*"} == 1 and signals_metric_outbox_pending > 0 and increase(signals_movement_event_published_total[5m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Signals is UP but its economic Kafka handoff is stalled"

      - alert: SignalsUserFillWithoutEligibleEconomics
        expr: |
          increase(signals_hyperliquid_user_fill_economic_total[15m]) > 0
          and
          increase(signals_hyperliquid_user_fill_economic_total{metricEligible="true"}[15m]) == 0
        for: 10m
        labels:
          severity: critical
          contract: hot-economic
        annotations:
          summary: "Signals persists USER_FILL but none remain economically eligible"

      - alert: SignalsUserFillSourceLedgerDivergence
        expr: |
          increase(signals_hyperliquid_user_fill_economic_total{economicBasisStatus="SOURCE_LEDGER_DIVERGENCE"}[5m]) > 0
        for: 0m
        labels:
          severity: high
          contract: hot-economic
        annotations:
          summary: "An authoritative USER_FILL contradicted the trusted authoritative ledger"

      - alert: SignalsUserFillPreexistingBoundaryRate
        expr: |
          increase(signals_hyperliquid_user_fill_economic_total{reason="AUTHORITATIVE_PREEXISTING_POSITION_BOUNDARY"}[15m]) > 0
        for: 0m
        labels:
          severity: info
          contract: hot-economic
        annotations:
          summary: "Signals established an authoritative boundary for a preexisting position"
